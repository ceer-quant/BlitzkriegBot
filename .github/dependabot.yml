version: 2
updates:
  - package-ecosystem: "npm"
    # The only npm project is the webUI app (no root package.json — a "/"
    # directory makes the Dependabot updater abort every weekly run with
    # "package.json not found" and log a red job).
    directory: "/ui/webapp/webui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major versions to prevent breaking changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
