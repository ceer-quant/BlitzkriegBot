name: "✨ 功能请求 / Feature request"
description: 提出新功能或改进建议
title: "[feat] "
labels: ["type/feature", "status/triage"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 目标模块
      options:
        - "rust-core (core/blitzkrieg_core)"
        - "strategy / engine"
        - "risk / safety"
        - "shadow-evolution"
        - "market extension"
        - "ui-kit / panel"
        - "node shell / gateway"
        - "ci / tooling / docs"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述痛点，而非直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: dropdown
    id: risk
    attributes:
      label: 是否涉及交易安全面
      options:
        - "否（纯展示/工具/文档）"
        - "是，涉及风控/资金/下单路径（需谨慎评审）"
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该请求不要求开启 Live 交易（Live 需人工显式批准）
          required: true
