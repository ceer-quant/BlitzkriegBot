# Label taxonomy for BlitzkriegBot.
#
# Canonical, machine-appliable source of truth. Apply with:
#   bash scripts/github/bootstrap-repo.sh --labels
# or manually:
#   gh label create --force ...  (this file uses GitHub's `labels.yml` shape)
#
# Dimensions: priority/* · status/* · type/* · module/* · ai/* · special/*
# Colour convention: reds = urgency, blues = state, greens = type,
# purples = module, oranges = AI, greys = special.

# ── priority ────────────────────────────────────────────────────────────────
- name: "priority/P0"
  color: "b60205"
  description: "资金或安全风险，立即处理；可能影响真实下单"
- name: "priority/P1"
  color: "d93f0b"
  description: "高优先级，当前迭代必须完成"
- name: "priority/P2"
  color: "fbca04"
  description: "中优先级，计划内"
- name: "priority/P3"
  color: "c2e0c6"
  description: "低优先级 / 锦上添花"

# ── status ──────────────────────────────────────────────────────────────────
- name: "status/triage"
  color: "1d76db"
  description: "待分类 / 待补充信息"
- name: "status/ready"
  color: "0e8a16"
  description: "已明确，可开始"
- name: "status/in-progress"
  color: "0052cc"
  description: "进行中"
- name: "status/blocked"
  color: "b60205"
  description: "被阻塞，需要外部输入"
- name: "status/review"
  color: "5319e7"
  description: "待评审"
- name: "status/done"
  color: "0e8a16"
  description: "已完成"

# ── type ────────────────────────────────────────────────────────────────────
- name: "type/bug"
  color: "d73a4a"
  description: "缺陷"
- name: "type/feature"
  color: "a2eeef"
  description: "新功能"
- name: "type/refactor"
  color: "bfd4f2"
  description: "重构，不改变行为"
- name: "type/perf"
  color: "fbca04"
  description: "性能"
- name: "type/docs"
  color: "0075ca"
  description: "文档"
- name: "type/chore"
  color: "ededed"
  description: "杂项 / 构建 / CI"
- name: "type/test"
  color: "c5def5"
  description: "测试"

# ── module ──────────────────────────────────────────────────────────────────
- name: "module/rust-core"
  color: "5319e7"
  description: "Blitzkrieg_core Rust 交易内核"
- name: "module/strategy"
  color: "6f42c1"
  description: "策略 / 引擎"
- name: "module/risk"
  color: "8a2be2"
  description: "风控 / 安全层"
- name: "module/shadow-evolution"
  color: "7b68ee"
  description: "影子进化"
- name: "module/market-extension"
  color: "9370db"
  description: "行情/交易所扩展"
- name: "module/ui-kit"
  color: "a371f7"
  description: "UI Kit / 面板"
- name: "module/gateway"
  color: "b39ddb"
  description: "网关 / Node 外壳"
- name: "module/ci"
  color: "c9b1ff"
  description: "CI / 工具链 / 仓库治理"

# ── ai ──────────────────────────────────────────────────────────────────────
- name: "ai/authored"
  color: "ff8c00"
  description: "内容由 AI 生成（需人工复核）"
- name: "ai/reviewed"
  color: "ffa500"
  description: "AI 生成且已由人工复核"
- name: "ai/managed"
  color: "ffb347"
  description: "AI 托管执行的任务"

# ── special ─────────────────────────────────────────────────────────────────
- name: "special/security"
  color: "000000"
  description: "安全相关，谨慎处理，勿公开细节"
- name: "special/needs-decision"
  color: "d4c5f9"
  description: "存在未决分歧，已记录到 DECISIONS_PENDING"
- name: "special/no-live"
  color: "ffffff"
  description: "禁止启用 Live 交易的改动"
- name: "good first issue"
  color: "7057ff"
  description: "适合新手"
- name: "dependencies"
  color: "0366d6"
  description: "依赖升级"
