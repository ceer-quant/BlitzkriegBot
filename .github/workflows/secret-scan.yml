name: Secret Scan (deep)

# Weekly deep scan of the FULL git history, plus manual dispatch. The per-PR
# scan in ci.yml only checks the working tree; this one sweeps every commit for
# credentials that were added and later removed (e.g. a rotated key).
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — required
      - name: Full-history secret scan
        run: bash scripts/secret-scan.sh --history
      - name: gitleaks full history (advisory)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect --config /repo/.gitleaks.toml \
            --redact --verbose --log-opts="--all"
