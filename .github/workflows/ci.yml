name: CI

# Runs on every PR and on pushes to the long-lived branches.
# Five independent gates, matching the repository governance plan:
#   rust-check     — the Rust trading core builds, tests, lints and holds the
#                    release binary / tracked-tree size budget (E10-d).
#   panel-check    — the browser panel: Vue checks, then the `ui:webapp` gate
#                    against a live gateway over a real socket, plus the
#                    lifecycle / read-only / crash-recovery acceptance gates
#                    and the order/ledger parity gates.
#   core-gates     — the specialized acceptance gates (E2/E4/E5/E9/P-1...),
#                    promoted from manual-only to CI (KI-9).
#   release-bundle — assembles the actual deliverable and holds it under 500 MB
#                    (E10-e). The deliverable is the *union* of what the jobs
#                    above build piecemeal, so only a job building the union can
#                    measure it.
#   secret-scan    — no credential ever enters the tree (dependency-free).
# The Node/TS verification layer was removed (production is 100% Rust); all gate
# drivers are bare-Node stdlib scripts under scripts/. A final `notify` job
# reports the aggregate result to WeChat when configured.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # External strategy cdylibs live in their OWN nested workspaces (separate
      # Cargo.lock), like a real third-party strategy author's project, so they
      # are not members of the root workspace and must be built explicitly. E7
      # (#38) acceptance requires a real dylib loaded and driven in CI.
      - name: Build external strategy cdylibs (standalone workspaces)
        run: |
          (cd user_layer/strategies && cargo build --release --locked)
          (cd user_layer/parity_strategy && cargo build --release --locked)
      - name: Build (release)
        run: cargo build --release --workspace --locked
      # Size budget (E10-d), BLOCKING. The [profile.release] settings in the root
      # Cargo.toml are the only thing holding the binaries at ~10 MB, and a plain
      # `cargo build` reports nothing when a dependency silently triples them.
      # Also caps the tracked tree (what a clone pulls) at 100 MB, so a large
      # binary cannot be committed by accident.
      # Needs node; only standard-library modules are used, so no `npm ci`.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Binary & repo size budget
        run: node scripts/binary-size-check.mjs --verbose
      # BK_REQUIRE_DYLIB=1 turns the dylib-driven tests from skip into hard
      # failure if the artifacts above are missing or fail negotiation.
      - name: Test
        run: BK_REQUIRE_DYLIB=1 cargo test --workspace --locked
      # Style gates are BLOCKING as of KI-13: the tree is fmt- and clippy-clean
      # (the debt that made these advisory is paid off in the two commits that
      # closed KI-13). Keep them blocking — a new warning should fail a PR, which
      # is the whole point of clearing the backlog.
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  panel-check:
    name: panel-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # ui_kit_web + blitzkrieg-core in release: the gate drives the real binaries.
      # The parity gates in this job run a real core with --engine, which loads
      # external cdylibs from user_layer/strategies.
      - name: Build external strategy cdylibs (standalone workspaces)
        run: |
          (cd user_layer/strategies && cargo build --release --locked)
          (cd user_layer/parity_strategy && cargo build --release --locked)
      - name: Build the gateway and core (release)
        run: cargo build --release --locked -p blitzkrieg-ui-kit -p blitzkrieg-core
      - name: Build the panel bundle
        run: |
          cd ui/webapp/webui
          npm ci
          npm run build
      # The panel's own regression checks: theme follows the system, balance
      # accounting, lifecycle gating, refusal attribution, feed liveness, session
      # recovery, history-tab order/keys/pagination, round-header digit rolling,
      # strategies expand/collapse reflow.
      # Each pins a defect that shipped and was fixed.
      - name: Panel checks (theme / balance / lifecycle / rejections / feed / session / history / round / expand)
        run: |
          cd ui/webapp/webui
          npm run check
          npm run check:all
      # The acceptance gate: auth both directions, CSRF, snapshot non-empty,
      # served bundle identical to dist/. `--engine` is required for the core to
      # answer `engine.stats` at all.
      - name: ui:webapp gate
        run: node scripts/webapp-check.mjs
      # E12: shutdown must mean "the core is gone". Both gates need the release
      # binary built above. The first asserts resting orders are settled and the
      # process is reaped before stop() resolves; the second asserts a core
      # started by this process cannot outlive it. Together they cover the two
      # ways an exit used to leak: a fire-and-forget SIGTERM, and an orphaned
      # child. Neither touches the production socket — the first isolates via
      # TMPDIR, the second via BZK_CORE_ISOLATION — and the parent-monitor gate
      # scopes its cleanup to the core IT spawned (an unscoped kill once destroyed
      # a live core; see MIGRATION_LOG §51-a).
      #
      # The parent-monitor gate drives a generated .mjs under plain `node` with
      # the bare-Node client (scripts/lib/core-client.mjs): the driver must own
      # the core and die with it, so no wrapper may outlive SIGTERM.
      - name: Core shutdown cleanliness gate
        run: node scripts/shutdown-cleanliness-check.mjs
      - name: Core parent-monitor gate
        run: node scripts/parent-monitor-check.mjs
      # E12-e: `--readonly` must be structural, not conventional. The gate boots a
      # core with `--mode live` AND live-shaped credentials in its environment, so
      # a per-RPC guard that forgot one entry point would trade; it then asserts
      # over IPC that the mode stayed read-only, the venue executor was never
      # started, nothing reached a venue, and orders still settle locally.
      - name: Core read-only egress gate
        run: node scripts/readonly-egress-check.mjs
      # E12-c: "内核崩溃后 UI 能恢复/报告". The client has carried auto-restart and
      # adopt logic for a long time with nothing ever killing a core to test it, so
      # this gate SIGKILLs a live core and requires that (a) the in-flight request
      # settles rather than hanging, (b) a replacement core serves the same socket
      # under a DIFFERENT pid, (c) it accepts and settles a real order — i.e. it is
      # usable, not merely alive, and (d) the crash is distinguishable from a clean
      # exit. SIGKILL is deliberate: SIGTERM would let the core exit gracefully and
      # then "failed to restart" would be indistinguishable from a planned stop.
      - name: Core crash-recovery gate
        run: node scripts/crash-recovery-check.mjs
      # The same acceptance line, asked of the UI instead of the socket. The gate
      # above drives the crash itself, so it measures the core's crash-safety and
      # says nothing about the supervisor — while "内核崩溃后 UI 能恢复/报告" is a
      # claim about what the panel is told. This one starts the core THROUGH the
      # `--manage` gateway, SIGKILLs it, and requires the UI to be able to tell a
      # crash from a stop (`lastExit.kind`), to see a DIFFERENT pid serving
      # afterwards, to keep the crash visible after the restart repaired it, and
      # to report a deliberate stop as clean WITHOUT respawning it. Until this
      # gate existed, `Supervisor::reap` could swallow a crash unnoticed: it
      # cleared the child handle and kept no record, so the panel went on
      # reporting a process that was already gone.
      - name: Gateway crash-reporting gate (E12-c through the UI)
        run: node scripts/gateway-crash-recovery-check.mjs
      - name: Gateway signal shutdown gate
        run: node scripts/gateway-signal-stop-check.mjs
      # #172/#179: a gate's conclusion must name the code it describes. Before the
      # parity gates below report anything, this states the revision EMBEDDED in
      # the binary they will drive, requires it to be this checkout's, and requires
      # a core started from that binary to report the same revision over the wire.
      # It exists because core-parity once produced eight failures that all
      # descended from the gate's script and the binary coming from two different
      # code states — nothing in its output said so, and the only way to notice was
      # `nm | grep` on the binary. The summary lands in the run's step summary.
      - name: Core build provenance (which code is under test)
        run: node scripts/core-provenance-check.mjs
      # The lineage half of #179: does this commit contain the branch it will be
      # merged into? Advisory rather than blocking, because the deployment line and
      # `main` legitimately diverge today and #179's convergence half is tracked
      # separately — a permanent red would hide the next real one. It is a real
      # check all the same: a PR built on a stale base shows up as a failing step
      # with the missing branch named, which is exactly the #172 mismatch.
      - name: Branch lineage (advisory — #179)
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=200 origin \
            "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}" || true
          node scripts/core-provenance-check.mjs --require-ancestor "origin/${{ github.base_ref || 'main' }}"
      # Order/ledger semantics over the real wire (the compiled TS client this
      # used to depend on was removed with the Node layer; the bare-Node client
      # speaks the same newline-framed JSON-RPC 2.0).
      - name: Core order/ledger parity gate
        run: node scripts/core-parity.mjs
      - name: Account parity gate (dry/live ledgers bit-identical)
        run: node scripts/account-parity.mjs

  # KI-9: the specialized acceptance gates, promoted from "run them locally and
  # remember" to CI. Each pins a milestone acceptance (E2/E4/E5/E9/P-1) on the
  # REAL release binaries, each on its own isolated socket/scratch dir — none
  # touch the production socket or data/. What each gate pins is documented in
  # its header comment; the matrix lives in dev-docs/DEVELOPMENT.md §3.
  core-gates:
    name: core-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the core and UI binaries (release)
        run: cargo build --release --workspace --locked
      # strategy-gate / strategy-evolution / trend-follow drive the REAL dog
      # cdylib, which lives in its own nested workspace.
      - name: Build the strategy cdylibs (standalone workspaces)
        run: |
          (cd user_layer/strategies && cargo build --release --locked)
          (cd user_layer/parity_strategy && cargo build --release --locked)
      # E1: the full DryRun order chain, and the event-driven backtester
      # (capture from a live core → offline replay → bit-identical result).
      - name: Order-chain & backtest gates
        run: |
          node scripts/cycle-check.mjs
          node scripts/backtest-check.mjs
          node scripts/order-recovery-check.mjs
          node scripts/position-recovery-check.mjs
      # #192: what a position size COSTS, and what the curve it produces looks
      # like. `capacity-check` walks the kernel's own dry FOK match against a
      # stated ladder and reports the fill, VWAP, slippage in bps and the size at
      # which impact spends the budget — then states the configured caps against
      # that measurement (the default 100 USD notional cap is 25x the fixture's
      # 100-bps capacity, which is the finding, not a threshold). The equity gate
      # runs its --self-test here: the metrics and the verdicts are exercised
      # against fixtures with hand-computed answers, including a curve whose max
      # drawdown is exactly 50% (must be flagged at a 20% budget) and one that
      # reaches ruin — a size/curve gate that cannot fail is the defect this repo
      # keeps re-finding. The real-log mode is an ops run:
      #   node scripts/equity-drawdown-check.mjs --trades data/trades/trades.jsonl \
      #        --initial-balance 6 --capacity /tmp/capacity.json
      - name: Capacity & equity-curve gates (#192)
        run: |
          node scripts/capacity-check.mjs
          node scripts/equity-drawdown-check.mjs --self-test
      # E2: strategy-scoped sizing, gate exemptions (real dog cdylib), and
      # per-strategy shadow evolution.
      - name: Strategy-scoped gates (E2)
        run: |
          node scripts/strategy-limit-check.mjs
          node scripts/strategy-gate-check.mjs
          node scripts/strategy-evolution-check.mjs
      # E4: both builtin legs are first-class strategies, not code-path variants.
      - name: Strategy leg gates (E4)
        run: |
          node scripts/trend-follow-check.mjs
          node scripts/mean-reversion-check.mjs
      # E5: the panel consumes core events through the EventBus; the UI Kit
      # gateway command surface and plugin toggles work end-to-end.
      - name: UI Kit gates (E5)
        run: |
          node scripts/ui-eventbus-check.mjs
          node scripts/ui-kit-gateway-check.mjs
          node scripts/ui-plugin-check.mjs
      # E9: strategy developer chain (template → build → load → enable → signal)
      # and the scale gates (registry read latency, 40-connection feed fanout).
      - name: E9 strategy-dev & scale gates
        run: |
          node scripts/strategy-devcheck.mjs
          node scripts/scale-plugins-check.mjs
          node scripts/feed-scale-check.mjs
      # Assorted one-off invariants kept cheap.
      - name: Assorted gates (plugin selection / trade-log flag / TUI demo)
        run: |
          node scripts/market-plugin-check.mjs
          node scripts/trade-log-flag-check.mjs
          node scripts/tui-demo-check.mjs
      # KI-24: the `data/` backup mechanism, which did not exist when a
      # destructive-path bug emptied the working tree on 2026-09-17. The gate
      # leads with the REFUSAL branches (backing up into the repo, a recursive
      # source/dest nest, a symlinked destination) because that incident happened
      # precisely because the destructive path was exercised before the guard was
      # verified. It runs entirely on a throwaway fixture and never reads the real
      # data/. Blitzkrieg-core is only needed to have been built above, not here.
      - name: data-backup safety gate (KI-24)
        run: node scripts/data-backup-check.mjs
      # The guard that keeps the gates themselves from leaking. Every gate that
      # spawns a core directly now goes through `scripts/lib/child-guard.mjs`; if
      # that module ever regresses, an interrupted or failing gate leaves a core
      # with PPID=1 holding its socket — which is what a 33-hour orphan in the
      # process table on 2026-09-19 actually was. This gate deliberately uses
      # `sleep` rather than a core: it tests the reaping bookkeeping (including a
      # grandchild, and SIGTERM-before-SIGKILL), so it is fast and its failures
      # are unambiguous. `parent-monitor-check.mjs` covers the real core.
      - name: Child-guard gate
        run: node scripts/child-guard-check.mjs
      # KI-30: the ops-inspection layer is itself a set of guards, and five of
      # them could not fail — a probe of a route that never existed, two scans of
      # a file nobody writes, and a process check against a sampler with a bounded
      # lifetime. An always-on alarm and a never-firing check are the same defect:
      # no signal. This gate INJECTS each failure (plus the healthy case, so a
      # script that always reports ANOMALY cannot pass) instead of walking the
      # happy path. It runs on throwaway fixtures via the script's BK_* seams and
      # never reads or signals the real deployment.
      #
      # The step is bounded because the gate's first version hung after printing
      # its PASS (an unclosed fixture listener held the event loop open) and CI sat
      # on this step for ~40 minutes with nothing to show for it. The gate now has
      # its own watchdog; this is the second, independent bound so a wedge can
      # never again be mistaken for a slow gate.
      - name: soak-health gate (KI-30)
        timeout-minutes: 5
        run: node scripts/soak-health-check.mjs
      # D-30 gave the sampler a `--forever` mode. That is a change to a property
      # the health check reasons about: KI-30 rejected a process-name probe
      # *because* the sampler had a bounded lifetime, and a resident sampler
      # removes that specific reason while adding its own hazards. This gate pins
      # both lifetimes down — the resident mode must be asked for (a typo'd
      # horizon must not silently become a monitor that samples nothing and exits
      # 0), the stop switch must be prompt and must say so in the log, and the
      # bounded default must stay unchanged. Fixtures only; the real data/ and the
      # real core are never touched.
      - name: soak-monitor lifetime gate (D-30)
        timeout-minutes: 5
        run: node scripts/soak-monitor-check.mjs

  # E10-e: the third size target — the *deliverable* ≤ 500 MB — is the one that
  # cannot be read off the working tree. A developer checkout legitimately holds
  # tens of GB of gitignored scratch (target/, data/archive, node_modules/), so
  # "how big is what we hand someone" is only answerable by assembling it.
  #
  # NOTE on the script's --out handling: it deletes the destination before packing
  # (so a re-run is clean rather than a merge of two runs), and that deletion once
  # destroyed a working tree — see MIGRATION_LOG §50 / KI-24. The destination guard
  # is an allow-list with a default of REFUSAL, and the CI invocation deliberately
  # passes no --out at all, so it lands in a mktemp dir and touches nothing of ours.
  # Do not add --out here without re-reading that section.
  release-bundle:
    name: release-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the core and the UI binaries (release)
        run: cargo build --release --workspace --locked
      - name: Build the strategy cdylibs (standalone workspaces)
        run: |
          (cd user_layer/strategies && cargo build --release --locked)
          (cd user_layer/parity_strategy && cargo build --release --locked)
      - name: Build the panel bundle
        run: |
          cd ui/webapp/webui
          npm ci
          npm run build
      # BLOCKING. Measures a clean-checkout bundle: on a dev machine the bundle also
      # picks up artefacts a runner does not have (every workspace cdylib, the
      # debug-instrumented .so variants), which is why the number here runs a little
      # under the local one.
      - name: Deliverable ≤ 500 MB
        run: node scripts/package-release.mjs

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dependency-free secret scan (blocking)
        run: bash scripts/secret-scan.sh
      # Advisory, defence-in-depth: official gitleaks against the same config.
      # Non-blocking so a scanner-version hiccup cannot gate a legitimate PR;
      # GitHub native Push Protection (bootstrap-repo.sh) is the hard stop.
      - name: gitleaks (advisory)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect --config /repo/.gitleaks.toml --redact --verbose

  notify:
    name: notify (wechat)
    needs: [rust-check, panel-check, core-gates, release-bundle, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    # Secret lifted to job env so the step `if` can test it (secret-context
    # references inside step `if` are not reliably available across versions).
    env:
      WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
    steps:
      - name: WeChat Work webhook
        # Opt-in: silently skips unless the WECHAT_WEBHOOK secret is configured.
        if: ${{ env.WECHAT_WEBHOOK != '' }}
        env:
          RESULT: ${{ needs.rust-check.result }}/${{ needs.panel-check.result }}/${{ needs.core-gates.result }}/${{ needs.secret-scan.result }}
        run: |
          icon="✅"; [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] && icon="❌"
          curl -sS -X POST "$WECHAT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"$icon CI ${{ github.repository }}\\n> 分支: ${{ github.ref_name }}\\n> 触发: ${{ github.event_name }} by ${{ github.actor }}\\n> 结果(rust/panel/secret): $RESULT\\n> [查看运行](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\"}}"
