name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both audit steps are ADVISORY (non-blocking): the legacy Node shell has
      # 86 pre-existing production advisories (2 critical / 49 high / 33 mod)
      # that are all transitive in exchange/messaging SDK chains; the only
      # remediation is `npm audit fix --force` BREAKING trading-SDK majors.
      # The debt stays VISIBLE on every run but must not gate unrelated work.
      # Tracked in docs/DECISIONS_PENDING.md D-9.
      - name: npm audit (high/critical) - production only — advisory
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: audit-ci (moderate+) - production only — advisory
        continue-on-error: true
        run: npx --yes audit-ci --moderate --production

      - name: Check for known vulnerabilities
        run: |
          echo "=== Security Summary ==="
          npm audit --json | jq '.metadata.vulnerabilities'

