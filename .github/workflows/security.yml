name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  # The npm audit jobs were removed with the root Node layer (no root
  # package.json). The runtime dependency surface is Cargo (cargo-auditable /
  # cargo audit are the Rust-side follow-up, tracked in the internal roadmap);
  # the blocking credential gate lives in secret-scan (ci.yml / secret-scan.yml).
  cargo-deny:
    name: Rust dependency advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ADVISORY (non-blocking): surfaces known advisories in the Cargo
      # dependency graph on every run. Blocking requires a vetted
      # cargo-deny/deny.toml policy — registering new advisories must not gate
      # unrelated work.
      - name: cargo-audit (advisory)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || exit 0
          cargo audit

