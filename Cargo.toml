# Cargo workspace: the generic core plus official market extensions.
# The core (core/blitzkrieg_core) must NOT depend on any specific market SDK;
# concrete markets live under extensions/* and are wired in by feature.
[workspace]
resolver = "2"
members = [
    "core/market_api",
    "core/blitzkrieg_core",
    "extensions/polymarket",
    "user_layer/strategy_api",
    "ui/ui_kit",
    "ui/ui_kit_panel",
]
# user_layer/strategies is a SEPARATE nested workspace (it has [workspace]
# and builds the example dynamic strategy cdylib) — intentionally excluded.
exclude = ["user_layer/strategies"]

[workspace.dependencies]
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = "1"
async-trait = "0.1"
arc-swap = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["events"] }
