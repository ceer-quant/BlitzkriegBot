# Cargo workspace: the generic core plus official market extensions.
# The core (core/blitzkrieg_core) must NOT depend on any specific market SDK;
# concrete markets live under extensions/* and are wired in by feature.
[workspace]
resolver = "2"
members = [
    "core/market_api",
    "core/blitzkrieg_core",
    "extensions/polymarket",
    "user_layer/strategy_api",
    "user_layer/parity_logic",
    "ui/ui_kit",
    "ui/ui_kit_panel",
]
# user_layer/strategies and user_layer/parity_strategy are SEPARATE nested
# workspaces (each has [workspace]) that build example/test cdylibs —
# intentionally excluded so they carry their own Cargo.lock like a real external
# strategy author would.
# rust-executor is a standalone sidecar binary with its own Cargo.lock
# (Polymarket CLOB subprocess), not part of the core workspace.
exclude = ["user_layer/strategies", "user_layer/parity_strategy", "rust-executor", "ui/webapp/src-tauri"]

# ── Release profile (E10-d) ──────────────────────────────────────────────────
# Size/performance hardening for shipped binaries. Measured, not guessed: see
# docs/blitzkrieg/MIGRATION_LOG.md §49 for the before/after numbers.
[profile.release]
opt-level = 3
# Whole-program LTO + a single codegen unit: the two settings that actually
# matter for both throughput and size, at the cost of a slower link.
lto = "fat"
codegen-units = 1
# Keeps the symbol table but drops DWARF debug info. Deliberately NOT `true`:
# `strip = true` (== strip=symbols) removes symbols too, so a release-mode panic
# backtrace comes out EMPTY — verified on a minimal repro, not assumed. Measured
# cost of keeping symbols: 9.56 MB vs 8.07 MB (+1.49 MB, +18%) on the core
# binary. On a trading core, being able to name the panicking frame is worth it.
strip = "debuginfo"
# EXPLICITLY NOT `panic = "abort"`, despite it being the usual size lever.
# A panicking user-authored strategy variant must not take down the live engine,
# and that guarantee is implemented with `catch_unwind` — which `panic = "abort"`
# makes unable to catch. Two layers exist (strategies/shadow_twin.rs:277 swallows
# the twin's own panic; shadow_evolution/mod.rs:327 quarantines a panicking
# variant), and abort would void BOTH: one panic would terminate the core
# mid-session with open positions orphaned. The size win is not worth it —
# strip+lto already puts us 5x under the 50 MB target. See DECISIONS_PENDING
# D-20. Stated explicitly so nobody re-adds it by reflex.
panic = "unwind"

[workspace.dependencies]
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = "1"
async-trait = "0.1"
arc-swap = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["events"] }
