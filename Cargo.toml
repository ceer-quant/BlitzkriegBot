# Cargo workspace: the generic core plus official market extensions.
# The core (core/blitzkrieg_core) must NOT depend on any specific market SDK;
# concrete markets live under extensions/* and are wired in by feature.
[workspace]
resolver = "2"
members = [
    "core/build_support", # 构建期注入逻辑（build.rs 专用，VERSIONING.md §3.2）
    "core/build_info", # 运行期构建常量的唯一出口（BUILD_INFO）
    "core/market_api",
    "core/blitzkrieg_core",
    "extensions/polymarket",
    "user_layer/strategy_api",
    "user_layer/strategy_logic",
    "user_layer/parity_logic",
    # Wave 0 (#329): the Lua sandbox host — an intentionally empty crate whose
    # ONLY job in 0.3 Wave 0 is to pin mlua in Cargo.lock exactly once, so no
    # Epic has to edit the shared lock (§14.0). The sandbox itself is E30.
    "user_layer/lua_runtime",
    "ui/ui_kit",
    "ui/ui_kit_panel",
]
# user_layer/strategies and user_layer/parity_strategy are SEPARATE nested
# workspaces (each has [workspace]) that build example/test cdylibs —
# intentionally excluded so they carry their own Cargo.lock like a real external
# strategy author would.
exclude = ["user_layer/strategies", "user_layer/parity_strategy", "user_layer/examples", "ui/webapp/src-tauri"]

# ── 版本单事实来源（VERSIONING.md §3）────────────────────────────────────────
# 这是全仓库唯一人工编辑的版本号。任何 crate 都不得再写死 version（用
# `version.workspace = true` 继承）；scripts/version-guard.mjs 是这条规则的守卫。
# 语义化 `<major>.<minor>.<patch>[-rc.N]`；tag 形态为 v<version>，由 CI 守卫。
# 注意：构建元数据（+g<sha>）不写在这里 —— 它由 build.rs 在运行时拼接。
[workspace.package]
version = "0.3.0"

# ── Release profile ──────────────────────────────────────────────────────────
# Low-spec-friendly build (user-directed 2026-09-30): cheap and fast to
# compile on small machines — no whole-program LTO, 16 codegen units, basic
# optimization. Honest tradeoff: the shipped binary runs slower than the old
# measured baseline (opt-level 3 + lto=fat + codegen-units=1, numbers in
# dev-docs/blitzkrieg/MIGRATION_LOG.md §49); `binary-size-check.mjs` still
# gates the 50 MB budget in CI.
#
# Two prior decisions survive the change on purpose:
#   * `strip = "debuginfo"`, deliberately NOT `true`: strip=symbols removes
#     the symbol table too, so a release-mode panic backtrace comes out
#     EMPTY (verified on a minimal repro). On a trading core, naming the
#     panicking frame is worth the megabytes.
#   * EXPLICITLY NOT `panic = "abort"`, despite it being the usual size
#     lever. A panicking user-authored strategy variant must not take down
#     the live engine; that guarantee is `catch_unwind`, which abort makes
#     unable to catch (strategies/shadow_twin.rs swallows the twin's own
#     panic; shadow_evolution/mod.rs quarantines a panicking variant — abort
#     voids BOTH, one panic would kill the core mid-session with open
#     positions orphaned). See DECISIONS_PENDING D-20. Stated explicitly so
#     nobody re-adds it by reflex.
[profile.release]
opt-level = 1
codegen-units = 16
lto = false
debug = false
strip = "debuginfo"
panic = "unwind"

[workspace.dependencies]
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = "1"
async-trait = "0.1"
arc-swap = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["events"] }
libc = "0.2"
