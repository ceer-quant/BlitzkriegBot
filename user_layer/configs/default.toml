# User-layer runtime configuration — retired, kept as an archived record.
#
# 〔issue 967 退休，2026-11-06；issue 1189 正文移除，2026-11-13〕THIS FILE IS
# NOT READ. The kernel reads no configuration from this file: accounts, risk
# and exit policy live in SQLite (`data/blitzkrieg.sqlite`, issue #1189).
# `user_layer/configs/default.toml` 已退休，账户与风控配置见 SQLite
# （issue #1189）。
#
# The file is kept on purpose (issue #1189 §4 recommends archiving, not
# deletion). The `[engine]` / `[exit]` / `[risk]` bodies it used to carry were
# removed in PR-E: they were inert after #967, and keeping numbers in a
# "configuration" file invites treating them as armed settings — which they
# are not. Historical values live in git history (`git log --follow -- this
# file`).
#
# Where configuration actually comes from now:
#   - accounts / risk / exit policy:  SQLite (`data/blitzkrieg.sqlite`)
#   - global static knobs:            process environment (`.env`, `BK_*`)
#   - everything else:                compiled defaults
#
# 引用：https://github.com/ceer-quant/BlitzkriegBot/issues/1189 （PR-E）