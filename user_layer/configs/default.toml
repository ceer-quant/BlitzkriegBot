# User-layer runtime configuration. Parameters only; no credentials here.
# Credentials are read by the kernel process from its own environment.
#
# THIS FILE IS READ BY THE KERNEL (KI-11 / D-1). Editing a value here changes
# runtime behaviour. Precedence, highest first:
#
#     command-line flag  >  BK_* environment variable  >  this file  >  built-in default
#
# So `--round-sec 60` still beats `round_sec` below, and an unset key here falls
# back to the value compiled into the binary. The kernel logs every setting it
# resolved from above the default, naming its source, at startup.
#
# Turn the file off entirely with `--no-config` or `BK_CONFIG=none`; point at a
# different one with `--config <path>` or `BK_CONFIG=<path>`. The sibling
# `shadow_evolution.toml` in this directory is read with this file.
#
# ── env single-source (2026-10-23 operator ruling) ───────────────────────────
# The factory keys are GONE from this file on purpose: `.env` is the single
# trusted configuration source (see .env.example), and this file now documents
# the extension surface only. Every `[engine]` key the file used to set
# (assets / round_sec / min_round_age_sec / min_time_left_sec) is compiled into
# the binary at exactly the same value, so removing the explicit rows changes
# nothing at runtime — and it un-suppresses the round-duration UI card's
# persisted cell (data/runtime/config.json), which an explicit round_sec here
# was shadowing (issue 499, 2026-10-16 six-answers finding 1). Per-experiment
# overrides go in `.env` as BK_* variables or on the command line.

[engine]
# (keys intentionally absent — see the env single-source note above)

# ── The engine-level exit ladder (E17/#264) ──────────────────────────────────
# Exits belong to the KERNEL, not to a strategy library: these four knobs are
# read by `exit_policy::ExitConfig` for every strategy, including one nobody
# rebuilt. They are the same four the `--exit-*` flags set, and the flags win
# over this section (CLI > file > compiled default).
#
# Nothing is set here on purpose. The shipped ladder is the compiled one, and
# the ticket that added this section deliberately did NOT move it — a ladder is
# changed by measuring it (an A/B replay with `--exit-*`), not by editing a
# default. The values below are therefore documentation, written as comments:
# uncommenting one is an explicit act, and the startup log then names it
# (`exit.stop_loss_pct=12 (toml)`).
#
#   take_profit_pct       = 100   fixed take-profit, % of entry (a backstop only:
#                                 normal exits ride the trailing stop)
#   stop_loss_pct         = 12    stop-loss, % of entry
#   trailing_enabled      = false the trailing stop's arming switch. OFF is the
#                                 issue-356 calibration (the proven operator
#                                 never sold into profit — every exit was a
#                                 REDEEM/MERGE); hot-writable per session via
#                                 `risk.setExit` (trailingEnabled). Strategies
#                                 declare their OWN verdict per package — the
#                                 Lua manifest's `trailing_exit` key (absent =
#                                 follow this value; true/false = force
#                                 on/off for that strategy's positions) — so
#                                 spread_arb-style mean-reversion sellers bank
#                                 profit without flipping the kernel-wide
#                                 switch that the REDEEM-family philosophies
#                                 were calibrated against. NOT a startup
#                                 config key: this ladder's compiled face has
#                                 no trailing_enabled field, and the knob is
#                                 operator-hot-write + strategy-declaration
#                                 territory by design.
#   trailing_min_high_pct = 15    profit (%) needed before the trailing stop arms
#   min_trail_pct         = 8     floor for the trailing stop's give-back (%)
#
# [exit]
# stop_loss_pct = 12
# min_trail_pct = 8

# ── Systemic risk limits (E26 / DEV_V0_3 §4) ─────────────────────────────────
# Nine NEW limits that bound what any entry can put at risk, each shipped at
# 0 = OFF: an unconfigured kernel behaves EXACTLY as before (byte-identical
# audit — the factory promise). Uncommenting one is an explicit act, and the
# startup log names it (`risk.systemic: max_single_loss_usd=0.20 (toml)`), as
# does the readout the settings page shows (`risk.limits`: every number carries
# WHERE it came from — a bare "35" is not an answer an operator can act on).
#
# These are NOT hot keys: unlike risk.setLimits' per-order cap, a change here
# takes effect at the next kernel START. The daily-drawdown slot below is the
# SAME budget as the #173 daily-loss breaker (a slot alias, not a second
# counter).
#
#   [risk]
#   max_single_loss_usd         = "0.20"   # one entry's stop-loss loss (USD)
#   max_daily_drawdown_usd      = "5"      # = the #173 daily-loss budget (USD)
#   max_position_size           = "200"    # shares per account per token
#   max_consecutive_losses      = "3"      # account-level breaker (count)
#   cooldown_minutes            = "5"      # breaker cooldown (minutes)
#   max_total_position          = "10"     # open positions across ALL accounts
#   max_total_exposure_usd      = "50"     # open notional across ALL accounts
#   max_correlation_usd         = "20"     # same-asset notional ceiling (USD)
#   global_kill_switch_loss_usd = "10"     # all-accounts daily-loss halt (USD)
#
# The exit ladder Gate 4 binds is the exit policy's PROJECTION unless an
# explicit ladder opts in (validated row by row; a backwards ladder is
# warned about and does NOT take over):
#
#   [[risk.ladder]]
#   at_pct       = 50    # profit % of entry at which the step fires
#   close_ratio  = 0.5   # fraction of the position this step closes
#   move_stop_to = "0.45" # optional: where the stop moves to (price)

# ── Strategies are NOT configured here ───────────────────────────────────────
# PR-B removed `[strategy]`. The kernel ships ZERO strategies and enables
# NONE of them by default: every strategy comes from a cdylib under the
# strategy dir (default `user_layer/strategies`, scanned recursively for
# *.dylib/*.so at startup) and starts DISABLED. What starts enabled is the
# operator's persisted intent — `data/strategy-state.json`, rewritten on every
# panel/CLI toggle and replayed at the next boot — plus explicit
# `--enable-strategy <name>` / `--disable-strategy <name>` flags (an explicit
# off wins). A missing strategy dir or state file is normal, never an error.
