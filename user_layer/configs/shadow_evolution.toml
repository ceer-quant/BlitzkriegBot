# Shadow Evolution — opt-in adaptive parameter tuning (DISABLED by default).
#
# NOTE: this file is currently READ-ONLY DOCUMENTATION. No code path parses it
# (see docs/DECISIONS_PENDING.md D-1). The authoritative sources today are the
# kernel CLI flags and `ShadowEvolutionConfig::default()`. Editing a value here
# will NOT change runtime behaviour.
#
# When enabled, the kernel runs parallel VIRTUAL twins of each live strategy on
# the same tick stream (zero real cost) and, when one is significantly better
# for long enough, atomically publishes that strategy's new parameters through
# its own ArcSwap cell.
#
# Everything below is PER STRATEGY since E2-c (#28): each strategy declares its
# own evolvable knobs and value domains, is evaluated on its own twin against
# its own baseline, is audited in its own file, and is applied/rolled back
# independently of every other strategy.
#
# Three hard safety locks (not configurable here — enforced in code):
#   Lock 0 domain   : a value outside the strategy's declared [min,max] is
#                     rejected before the gradient lock is even consulted.
#   Lock 1 gradient : each mutable knob may move at most +/-5% per evolution.
#   Lock 2 immutable: hard stop / loss breaker / daily loss / order notional are
#                     NOT part of any swappable parameter set and can never evolve.
#
# Enable at runtime with IPC `shadow_evolution.enable` (or start with the
# kernel flag `--shadow-evolution`). Per-strategy IPC: `shadow_evolution.apply`
# and `shadow_evolution.rollback` both REQUIRE a `strategy` argument.

[shadow_evolution]
enabled = false                      # default OFF (opt-in)
evaluation_window_minutes = 30       # rolling metrics window
min_sample_count = 30                # >=30 virtual trades before judging
min_win_rate_improvement = 0.05      # variant WR must beat live by +5pp
min_profit_factor_improvement = 0.10 # variant PF must beat live by +10%
min_observation_minutes = 5          # variant must exist >=5 min
cooldown_minutes = 10                # min gap between applied evolutions
max_gradient = 0.05                  # +/-5% per step (Lock 1)
variant_count = 3                    # shadow variants (>=2)

# Audit DIRECTORY, not a file: the file name is derived from the strategy name,
# producing one self-describing log per strategy, e.g.
#   data/evolution/spread_arb.jsonl
#   data/evolution/dog_strategy.jsonl
# (non-alphanumeric characters outside [A-Za-z0-9_-.] are replaced with '_').
# The pre-E2-c single global file `data/evolution/evolution.jsonl` is superseded
# and is no longer written by any code path.
audit_dir = "data/evolution"
