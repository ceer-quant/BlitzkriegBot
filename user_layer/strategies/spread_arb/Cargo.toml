# The `spread_arb` strategy (the trend-confirmed dip buyer) as a C ABI v2
# cdylib. Decision logic comes from `strategy-logic` — the SAME crate the
# kernel's parity reference uses — so this library is bit-equivalent to the
# reference by construction; the kernel test-suite asserts it anyway.
[package]
name = "spread_arb_strategy"
version = "0.2.0"
edition = "2024"

[lib]
name = "spread_arb_strategy"
path = "spread_arb_strategy.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
blitzkrieg-strategy-api = { path = "../../strategy_api" }
strategy-logic = { path = "../../strategy_logic" }
rust_decimal = "1"
rust_decimal_macros = "1"
serde_json = "1"
