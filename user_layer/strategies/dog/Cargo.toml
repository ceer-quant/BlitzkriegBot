# The example external "dog" dip strategy (C ABI v2, SafeStrategy template).
# `cargo build --release` produces libdog_strategy.{dylib,so,dll}, which the
# kernel loads via the full-featured ABI v2 (feature `strategy-loading`, on by
# default). Member of the user_layer/strategies nested workspace — the kernel
# binary contains NO strategy code; every strategy enters through the same
# dlopen path a third-party library would.
[package]
name = "dog_strategy"
version = "0.2.0"
edition = "2024"

[lib]
name = "dog_strategy"
path = "dog_strategy.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
blitzkrieg-strategy-api = { path = "../../strategy_api" }
rust_decimal = "1"
rust_decimal_macros = "1"
serde_json = "1"
