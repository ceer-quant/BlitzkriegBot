services:
  blitzkrieg:
    build: .
    ports:
      - "18789:18789"
    env_file:
      - .env
    environment:
      BLITZKRIEG_STATE_DIR: /data
      BLITZKRIEG_WORKSPACE: /data/workspace
      BLITZKRIEG_CONFIG_PATH: /data/blitzkrieg.json
    volumes:
      - blitzkrieg_data:/data
    restart: unless-stopped

volumes:
  blitzkrieg_data:
