[package]
name = "blitzkrieg-core"
version = "0.2.0"
edition = "2024"
description = "Blitzkrieg Quant Core: market-agnostic trading core (strategy engine, OME, risk, ledger, market data, execution). Node/UI is a shell over this."

[[bin]]
name = "blitzkrieg-core"
path = "src/main.rs"

[lib]
name = "blitzkrieg_core"
path = "src/lib.rs"

# The A/B evolution harness drives the shipped `spread_arb` cdylib through the
# C ABI v2 loader, so it needs the loading feature (default on).
[[example]]
name = "shadow_evolution_ab"
required-features = ["strategy-loading"]

[features]
# The core itself is market-agnostic and has NO market SDK dependency. A market
# is supplied by an extension crate, linked in via a feature (see below). The
# default ships with the official Polymarket extension.
default = ["polymarket", "strategy-loading", "account-precision", "test-support"]
# Link the official Polymarket market extension as the operative market.
polymarket = ["dep:polymarket-extension"]
# Dynamic user-layer strategy loading (shared libraries). On by default since
# E7 (#38): the external v2 strategy interface is the SAME full contract as an
# in-tree strategy, and CI builds/drives a real cdylib. Exclude with
# `--no-default-features --features polymarket`.
strategy-loading = ["dep:libloading"]
# E17 accounting-precision gate. Enables the exhaustive maker/taker × partial-fill
# matrix and the dry/live ledger-parity harness (`cargo test --features
# account-precision`, one of the plan's gates). On by default so a plain
# `cargo test` exercises it too — the gate cannot silently stop running.
account-precision = []
# Exposes test_support adapters to integration tests.
test-support = []

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File-based configuration (KI-11 / D-1): `user_layer/configs/*.toml` is a real
# config source, resolved as CLI > env > TOML > default. The 1.x line's parser and
# datetime deps are already in the lock file, so this adds no new transitive tree.
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1"
rust_decimal_macros = "1"
libloading = { version = "0.8", optional = true }
# Frozen C ABI for user-layer dynamic strategies (path dep; rlib+cdylib).
blitzkrieg-strategy-api = { path = "../../user_layer/strategy_api" }
# THE shared strategy reference implementation (PR-B): the three builtin
# strategies' trackers/evaluators/knob tables live here, so the kernel wrapper
# and every external cdylib run the same code and cannot drift.
strategy-logic = { path = "../../user_layer/strategy_logic" }
# Market-plugin contract (no internal deps): DTOs + the DataFeed/Discovery/
# OrderExecutor traits + MarketHost. The core implements the host side here.
blitzkrieg-market-api = { path = "../market_api" }
# Official Polymarket market extension (optional; the default feature links it).
# The core never imports it directly except at the single assembly seam.
polymarket-extension = { path = "../../extensions/polymarket", optional = true }
async-trait = "0.1"
# Lock-free atomic parameter swap for Shadow Evolution (strategy hot path).
arc-swap = "1"

# statvfs for the archive's free-space guard (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rust_decimal_macros = "1"
# #236 seam test (tests/engine_stats_view_seam.rs): the kernel's own
# `engine.stats` payload is fed to the UI Kit's `EngineStatsView`, so the
# producer/consumer contract is pinned by a test instead of by review. Test-only
# on purpose — the shipped library must not link a UI crate (the kit is the layer
# meant to be replaceable), and a dev-dependency is not part of the lib graph.
blitzkrieg-ui-kit = { path = "../../ui/ui_kit" }
# Shared deterministic algorithm used by the E7 in-tree-vs-dylib parity harness
# (tests/foreign_parity.rs). Dev-only: never linked into the shipped library.
parity-logic = { path = "../../user_layer/parity_logic" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
# E14 hot-path micro-benchmarks (benches/hot_path.rs). Dev-only: the shipped
# library never links criterion.
criterion = "0.5"
# E14 memory accounting: allocation totals/peak for the hot path, exercised
# only from the dev harness (tests/dhat_profile.rs) — never shipped.
dhat = "0.3"

[[bench]]
name = "hot_path"
harness = false

