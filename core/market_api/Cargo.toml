[package]
name = "blitzkrieg-market-api"
version = "0.1.0"
edition = "2024"
description = "Market-agnostic plugin contract: domain DTOs + DataFeed/MarketDiscovery/OrderExecutor traits + MarketHost. Depends on nothing internal, so both the core and every market extension can link it without a dependency cycle."

[lib]
name = "blitzkrieg_market_api"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
tokio = { version = "1", features = ["sync"] }
