# Nested workspace of its own, like `user_layer/strategies` (own Cargo.lock):
# the Tauri shell is NOT a member of the kernel workspace, so Linux CI without
# the GTK headers never touches it. The `[workspace]` table is what says so to
# cargo — not the root manifest's `exclude`, which is a path relative to the
# root and therefore only covers the checkout it sits in. Without the table,
# `cargo check` here resolves the workspace root by walking UP, and from a git
# worktree under `<root>/target/` it walks past the worktree's own manifest
# (which excludes this path) to the main checkout's root (which does not, since
# that `exclude` entry means the main checkout's own `ui/webapp/src-tauri`) and
# fails with "believes it's in a workspace when it's not".
[workspace]

[package]
name = "blitzkrieg-webapp"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the Blitzkrieg desktop panel. Depends on blitzkrieg-ui-kit's headless AppViewModel; holds NO trading logic and NO GUI deps leak back into ui_kit."

# Tauri deps live ONLY here (E6-a contract: zero GUI deps in blitzkrieg-ui-kit).
[dependencies]
blitzkrieg-ui-kit = { path = "../../ui_kit" }
tauri = { version = "2", features = [] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
