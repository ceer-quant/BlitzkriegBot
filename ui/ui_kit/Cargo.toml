[package]
name = "blitzkrieg-ui-kit"
version.workspace = true
edition = "2021"
description = "Blitzkrieg UI Kit: a pure presentation layer over the Rust core's UDS JSON-RPC. Shared data model + IPC client + event bus, with web / TUI / app adapters. Holds NO trading logic."

[lib]
name = "blitzkrieg_ui_kit"
path = "src/lib.rs"

[[bin]]
name = "ui_kit_web"
path = "src/bin/web.rs"

[[bin]]
name = "ui_kit_app"
path = "src/bin/app.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
# #460: credential comparison must be constant-time by construction, not by
# hand-rolled XOR folklore. `subtle` is the ecosystem's audited primitive.
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
