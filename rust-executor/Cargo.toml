[package]
name = "clodds-rust-executor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
polymarket_client_sdk_v2 = { package = "polymarket_client_sdk_v2", git = "https://github.com/Polymarket/rs-clob-client-v2.git", features = ["clob"] }
alloy = { version = "1.6.3", default-features = false, features = ["signer-local"] }
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
