[package]
name = "polymarket-extension"
version = "0.1.0"
edition = "2024"
description = "Official Polymarket market extension for Blitzkrieg core (Poly1271, CLOB, Gamma discovery)."

[lib]
name = "polymarket_extension"
path = "src/lib.rs"
# cdylib so it can also be loaded dynamically in a later stage; the core links
# it via the `polymarket` feature for the default shipped binary.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The extension depends ONLY on the market contract + the SDK. It must NOT
# depend on blitzkrieg-core (that would form a dependency cycle once the core
# links this crate via its `polymarket` feature).
blitzkrieg-market-api = { path = "../../market_api" }
polymarket-client-sdk-v2 = { package = "polymarket_client_sdk_v2", git = "https://github.com/Polymarket/rs-clob-client-v2.git", rev = "561830b9ee502c6e67cce314f0e53a80b8885b09", features = ["clob", "ws", "data", "gamma"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
async-trait = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
alloy = { version = "1.6.3", default-features = false, features = ["signer-local"] }
