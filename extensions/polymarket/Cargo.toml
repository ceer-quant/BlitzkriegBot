[package]
name = "polymarket-extension"
version.workspace = true
edition = "2024"
description = "Official Polymarket market extension for Blitzkrieg core (Poly1271, CLOB, Gamma discovery)."

[lib]
name = "polymarket_extension"
path = "src/lib.rs"
# cdylib so it can also be loaded dynamically in a later stage; the core links
# it via the `polymarket` feature for the default shipped binary.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The extension depends ONLY on the market contract + the SDK. It must NOT
# depend on blitzkrieg-core (that would form a dependency cycle once the core
# links this crate via its `polymarket` feature).
blitzkrieg-market-api = { path = "../../core/market_api" }
polymarket-client-sdk-v2 = { package = "polymarket_client_sdk_v2", git = "https://github.com/Polymarket/rs-clob-client-v2.git", rev = "561830b9ee502c6e67cce314f0e53a80b8885b09", features = ["clob", "ws", "data", "gamma", "ctf"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
alloy = { version = "1.6.3", default-features = false, features = ["signer-local", "provider-http", "contract", "rpc-types"] }
# Manual L2-signed sweep client: the SDK's response schema rejects empty
# decimal strings the venue legitimately sends on /data/* rows, so the sweep
# fetches raw JSON itself (versions pinned to the SDK's tree to share builds).
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# 1h/daily 轮的 slug 按 ET 时钟命名（America/New_York）：DST 切换由 tzdata
# 承担（2026-11-01 即切换日），禁止手写 UTC 偏移表。chrono 由 chrono-tz
# 以 `chrono?/clock` 特性带出，这里只做 UTC→ET 的换算，无需本地时区探测。
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = "0.10"
