[package]
name = "blitzkrieg-polysimulator"
version.workspace = true
edition = "2024"
description = "PolySimulator market extension client for Blitzkrieg core (SIMULATED venue: REST, X-API-Key auth, token-bucket rate limiting). #454"

[lib]
name = "blitzkrieg_polysimulator"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The extension depends ONLY on the market contract (blitzkrieg-bk-contract,
# #841: the canonical leaf; no market_api internal paths). It must NOT depend
# on blitzkrieg-core — since #841 only the composition root
# (core/blitzkrieg_launcher) links this crate, so an inverse edge would not
# only form a cycle, it would break the plugin/kernel boundary.
blitzkrieg-bk-contract = { path = "../../core/bk_contract" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
rust_decimal = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "socks"] }
thiserror = "2"
url = "2"
mime = "0.3"
