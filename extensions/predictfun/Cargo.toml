[package]
name = "blitzkrieg-predictfun"
version.workspace = true
edition = "2024"
description = "predict.fun market extension client for Blitzkrieg core (REST + WebSocket, x-api-key + JWT auth, token-bucket rate limiting). #423"

[lib]
name = "blitzkrieg_predictfun"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The extension depends ONLY on the market contract (blitzkrieg-bk-contract,
# #841: the canonical leaf; no market_api internal paths). It must NOT depend
# on blitzkrieg-core — since #841 only the composition root
# (core/blitzkrieg_launcher) links this crate, so an inverse edge would not
# only form a cycle, it would break the plugin/kernel boundary.
blitzkrieg-bk-contract = { path = "../../core/bk_contract" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
async-trait = "0.1"
rust_decimal = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "socks"] }
thiserror = "2"
url = "2"
mime = "0.3"
# EIP-712 order signing (executor): same pin as polymarket's signer stack.
alloy = { version = "1.6.3", default-features = false, features = ["signer-local"] }
rand = "0.8"
