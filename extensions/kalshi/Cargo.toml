[package]
name = "blitzkrieg-kalshi"
version.workspace = true
edition = "2024"
description = "Kalshi market extension client for Blitzkrieg core (REST + WebSocket, RSA auth, token-bucket rate limiting). #423"

[lib]
name = "blitzkrieg_kalshi"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The extension depends ONLY on the market contract (blitzkrieg-bk-contract,
# #841: the canonical leaf; no market_api internal paths). It must NOT depend
# on blitzkrieg-core — since #841 only the composition root
# (core/blitzkrieg_launcher) links this crate, so an inverse edge would not
# only form a cycle, it would break the plugin/kernel boundary.
blitzkrieg-bk-contract = { path = "../../core/bk_contract" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
async-trait = "0.1"
rust_decimal = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "socks"] }
base64 = "0.22"
# RSA-PSS request signing (Kalshi API key auth).
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
url = "2"
mime = "0.3"

[dev-dependencies]
rust_decimal_macros = { workspace = true }
