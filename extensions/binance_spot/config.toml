# Extension config for the binance_spot market extension (structural shell).
#
# Read at kernel startup (KI-11): [meta] is parsed and checked against the linked
# extension, so name/version/extension_type drift is reported. [dependencies],
# [market] and [risk] are recognised but have no adapter yet — they are reported
# as declared-but-inert rather than acted on. No hot reload: restart to apply.

[meta]
name = "binance_spot"
version = "0.1.0"
extension_type = "market"
enabled = false            # shell only; not wired to trading yet
description = "Binance spot market adapter (extension-point proof)"

# Declared-but-unacted metadata: the extension loader surfaces every key it
# does not act on as `declared_only` (config.rs) — this row tells a reader a
# shell-only plugin would depend on the core IF it were ever wired, and the
# transparency list says as much. Not a Cargo manifest; no build effect.
[dependencies]
blitzkrieg_core = ">=0.1.0"

[market]
data_endpoint = "wss://stream.binance.com:9443/ws"
symbols = ["BTCUSDT", "ETHUSDT"]
trading_enabled = false

[risk]
max_position_size = 1.0
max_daily_loss = 500.0
